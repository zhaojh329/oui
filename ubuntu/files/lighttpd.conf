server.modules += ( "mod_rewrite", "mod_setenv", "mod_scgi" )

$SERVER["socket"] == "127.0.0.1:8080" {
    server.document-root = "/var/www/oui"
    index-file.names = ( "index.html" )
    include_shell "/bin/sh /etc/lighttpd/oui-gzip.sh /var/www/oui"

    scgi.server = ( "/oui-" => (
        "oui" => (
            "socket" => "/var/run/oui.sock",
            "check-local" => "disable"
        )
    ))
}
