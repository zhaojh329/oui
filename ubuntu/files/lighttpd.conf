server.modules += ( "mod_scgi", "mod_magnet" )

$SERVER["socket"] == "127.0.0.1:8080" {
    server.document-root = "/var/www/oui"
    index-file.names = ( "index.html" )
    magnet.attract-physical-path-to = ( "/etc/lighttpd/oui-handler.lua" )

    scgi.server = ( "/oui-" => (
        "oui" => (
            "socket" => "/var/run/oui.sock",
            "check-local" => "disable"
        )
    ))
}
